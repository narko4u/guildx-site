# GuildX A2A - stable public face. Proxies the live runtime (quick tunnel).
# The tunnel URL rotates on restart; this file is regenerated by the
# tunnel-watch cron (update_guildx_tunnel.sh). Never hardcode elsewhere.

[[redirects]]
  from = "/api/*"
  to = "https://guildx.empirelabs.com.au/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/x402"
  to = "https://guildx.empirelabs.com.au/.well-known/x402"
  status = 200
  force = true

[[redirects]]
  from = "/agent.json"
  to = "https://guildx.empirelabs.com.au/agent.json"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "https://guildx.empirelabs.com.au/llms.txt"
  status = 200
  force = true

[[redirects]]
  from = "/docs/*"
  to = "https://guildx.empirelabs.com.au/docs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "https://guildx.empirelabs.com.au/"
  status = 200
  force = true
